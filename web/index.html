<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimble — Instant Answers</title>
<meta name="description" content="Native instant-answer search. Math offline, knowledge via Wikipedia & DuckDuckGo.">
<meta name="theme-color" content="#ffca30">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="tokens.css">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  /* Page-local aliases onto the design system (tokens.css) */
  :root{--accent:var(--yellow-deep);--mid:var(--text-mid)}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  ::selection{background:var(--yellow);color:var(--black)}
  .app{flex:1;display:flex;flex-direction:column;width:100%;padding:var(--s3)}
  .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:var(--s4)}
  .brand svg{width:30px;height:30px}
  .brand h1{font-size:1.25rem;font-weight:var(--fw-bold);letter-spacing:var(--tracking-tight)}
  .body{width:100%;max-width:720px;margin:0 auto;flex:1;display:flex;flex-direction:column}
  form{display:flex;border-bottom:var(--divider)}
  #splash{position:fixed;inset:0;background:var(--yellow);display:flex;align-items:center;justify-content:center;z-index:9;transition:opacity .3s ease}
  #splash.hide{opacity:0;pointer-events:none}
  /* ponytail: splash + spinner share one rotate keyframe — they used to be two
     rules both named "s", where the second silently overrode the first. */
  #splash svg{width:64px;height:64px;animation:spin .9s ease-in-out infinite alternate}
  input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--font);font-size:1.4rem;padding:.9rem 0}
  input::placeholder{color:var(--text-light)}
  button{background:transparent;border:0;color: var(--link, var(--accent));font-family:var(--font);font-weight:var(--fw-bold);padding:0 .4rem;cursor:pointer;font-size:1rem}
  button:disabled{opacity:.4;cursor:default}
  .result{margin-top:1.6rem;flex:1;display:none}
  .result.show{display:block}
  .result h2{font-size:1.3rem;margin-bottom:var(--s1)}
  .result .big{font-size:2.4rem;font-weight:var(--fw-bold);color: var(--link, var(--accent))}
  .result p{color:var(--text);line-height:var(--lh)}
  .result .src{margin-top:.9rem;font-size:.8rem;color:var(--mid)}
  .result .src a{color: var(--link, var(--accent));text-decoration:none}
  .result img{max-width:120px;border-radius:var(--radius-card);float:right;margin:0 0 .6rem .8rem}
  .hint{text-align:center;color:var(--mid);font-size:.8rem;padding:var(--s2) 0}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color: var(--link, var(--accent));border-radius:50%;animation:spin .6s linear infinite;vertical-align:-3px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="splash"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimble"><rect width="200" height="200" rx="44" fill="#000"/><circle cx="100" cy="80" r="44" fill="#ffca30"/><rect x="85" y="110" width="30" height="26" fill="#ffca30"/><rect x="80" y="130" width="40" height="32" rx="8" fill="#ffca30"/><rect x="80" y="140" width="40" height="5" fill="#000"/><rect x="80" y="150" width="40" height="5" fill="#000"/></svg></div>
<main class="app">
  <div class="brand">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimble"><rect width="200" height="200" rx="44" fill="#000"/><circle cx="100" cy="80" r="44" fill="#ffca30"/><rect x="85" y="110" width="30" height="26" fill="#ffca30"/><rect x="80" y="130" width="40" height="32" rx="8" fill="#ffca30"/><rect x="80" y="140" width="40" height="5" fill="#000"/><rect x="80" y="150" width="40" height="5" fill="#000"/></svg>
    <h1>Nimble</h1>
  </div>
  <div class="body">
    <form id="f" autocomplete="off">
      <input id="q" placeholder="Ask anything — math, facts, definitions" autofocus>
      <button id="go" type="submit">Search</button>
    </form>
    <section class="result" id="r"></section>
    <p class="hint">Math runs offline. Knowledge via Wikipedia &amp; DuckDuckGo.</p>
  </div>
</main>
<script>
const ANSWER_PROXY = "https://nimble-answers.trommatic.workers.dev";
const $ = s => document.querySelector(s);
const r = $("#r"), q = $("#q"), go = $("#go");

// --- offline math ---
// ponytail: whitelist-guarded eval over Math.*; upgrade to a real parser if untrusted input ever matters.
function tryMath(s){
  const t = s.trim().toLowerCase().replace(/\^/g,"**").replace(/\bpi\b/g,"Math.PI").replace(/\be\b/g,"Math.E")
    .replace(/\b(sqrt|sin|cos|tan|log|log2|log10|abs|round|floor|ceil|cbrt)\b/g,"Math.$1")
    .replace(/\bln\b/g,"Math.log");
  if(!/^[0-9+\-*/(). ,]*(Math\.[a-z0-9]+|[0-9+\-*/(). ,])*$/.test(t)) return null;
  if(!/[0-9]/.test(t) || !/[+\-*/]|Math\./.test(t)) return null;
  try{ const v = Function('"use strict";return ('+t+')')();
    return (typeof v==="number" && isFinite(v)) ? v : null; }
  catch{ return null; }
}

// --- units (ponytail: flat table in base units; add rows, not code) ---
const U={mm:[.001,"len"],cm:[.01,"len"],m:[1,"len"],km:[1000,"len"],in:[.0254,"len"],inch:[.0254,"len"],inches:[.0254,"len"],ft:[.3048,"len"],foot:[.3048,"len"],feet:[.3048,"len"],yd:[.9144,"len"],yard:[.9144,"len"],yards:[.9144,"len"],mi:[1609.344,"len"],mile:[1609.344,"len"],miles:[1609.344,"len"],meter:[1,"len"],meters:[1,"len"],metre:[1,"len"],metres:[1,"len"],kilometer:[1000,"len"],kilometers:[1000,"len"],kilometre:[1000,"len"],kilometres:[1000,"len"],
g:[.001,"mass"],gram:[.001,"mass"],grams:[.001,"mass"],kg:[1,"mass"],kilogram:[1,"mass"],kilograms:[1,"mass"],oz:[.028349523125,"mass"],ounce:[.028349523125,"mass"],ounces:[.028349523125,"mass"],lb:[.45359237,"mass"],lbs:[.45359237,"mass"],pound:[.45359237,"mass"],pounds:[.45359237,"mass"],
ml:[.001,"vol"],l:[1,"vol"],liter:[1,"vol"],liters:[1,"vol"],litre:[1,"vol"],litres:[1,"vol"],cup:[.2365882365,"vol"],cups:[.2365882365,"vol"],gal:[3.785411784,"vol"],gallon:[3.785411784,"vol"],gallons:[3.785411784,"vol"],
mph:[.44704,"speed"],kph:[.277778,"speed"],kmh:[.277778,"speed"],"km/h":[.277778,"speed"],
kb:[1e3,"data"],mb:[1e6,"data"],gb:[1e9,"data"],tb:[1e12,"data"],kilobytes:[1e3,"data"],megabytes:[1e6,"data"],gigabytes:[1e9,"data"],terabytes:[1e12,"data"],
sec:[1,"time"],second:[1,"time"],seconds:[1,"time"],min:[60,"time"],minute:[60,"time"],minutes:[60,"time"],hr:[3600,"time"],hour:[3600,"time"],hours:[3600,"time"],day:[86400,"time"],days:[86400,"time"],week:[604800,"time"],weeks:[604800,"time"],
c:[0,"temp"],celsius:[0,"temp"],f:[0,"temp"],fahrenheit:[0,"temp"],k:[0,"temp"],kelvin:[0,"temp"]};
function convertValue(v,from,to){
  const a=U[from], b=U[to]; if(!a||!b||a[1]!==b[1]) return null;
  if(a[1]==="temp"){ const K=from[0]==="c"?v+273.15:from[0]==="f"?(v-32)*5/9+273.15:v;
    return to[0]==="c"?K-273.15:to[0]==="f"?(K-273.15)*9/5+32:K; }
  return v*a[0]/b[0];
}
function tryConvert(s){
  const q=s.trim().toLowerCase();
  let m=q.match(/^(?:convert\s+)?(-?\d+(?:\.\d+)?)\s*°?\s*([a-z/]+)\s+(?:to|in|into|as)\s+°?([a-z/]+)\??$/);
  let v,from,to;
  if(m){ [,v,from,to]=m; }
  else { m=q.match(/^how many\s+([a-z/]+)\s+(?:are\s+)?in\s+(-?\d+(?:\.\d+)?)\s*°?\s*([a-z/]+)\??$/); if(!m) return null; [,to,v,from]=m; }
  const out=convertValue(+v,from,to); if(out===null) return null;
  const t=n=>(+(+n).toFixed(6)).toString();
  return {from:t(v),to:t(out),fromUnit:from,toUnit:to};
}

// --- graph (points from Curvely's public API) ---
function graphExpr(s){
  let q=s.trim().toLowerCase();
  const verb=/^(plot|graph|draw|sketch)\s+/.test(q); q=q.replace(/^(plot|graph|draw|sketch)\s+/,"");
  const y=/^(y|f\(x\))\s*=\s*/.test(q); q=q.replace(/^(y|f\(x\))\s*=\s*/,"");
  return (verb||y) && q.includes("x") && /^[0-9a-z+\-*/^(). ]+$/.test(q) ? q : null;
}
async function graph(expr){
  try{
    const r=await fetch("https://curvely.heyitsmejosh.com/api/sample",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({expr,from:-10,to:10,samples:200})});
    if(!r.ok) return null;
    const pts=(await r.json()).points.filter(p=>Number.isFinite(p.y)); if(pts.length<3) return null;
    const W=480,H=200, xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys), ys_=Math.max(y1-y0,1e-9);
    const X=x=>(x-x0)/(x1-x0)*W, Y=y=>H-(y-y0)/ys_*H;
    let d="",prev=null;
    for(const p of pts){ d+=(prev===null||p.x-prev>(x1-x0)/50?"M":"L")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1); prev=p.x; }
    const ax=(y0<=0&&y1>=0?`<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>`:"")+(x0<=0&&x1>=0?`<line y1="0" y2="${H}" x1="${X(0)}" x2="${X(0)}"/>`:"");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><g stroke="currentColor" stroke-opacity=".3">${ax}</g><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }catch{ return null; }
}

function render(html){ r.innerHTML = html; r.classList.add("show"); }
function loading(){ render('<p><span class="spin"></span> Searching…</p>'); }

async function ddg(query){
  try{
    const d = await (await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`)).json();
    const heading = d.Heading || query;
    if(d.Answer) return {title:heading, body:d.Answer, src:d.AbstractSource||"DuckDuckGo", url:d.AbstractURL, img:d.Image?`https://duckduckgo.com${d.Image}`:null};
    if(d.AbstractText) return {title:heading, body:d.AbstractText, src:d.AbstractSource||"DuckDuckGo", url:d.AbstractURL, img:d.Image?`https://duckduckgo.com${d.Image}`:null};
    if(d.Definition) return {title:heading, body:d.Definition, src:d.DefinitionSource||"DuckDuckGo", url:d.DefinitionURL};
  }catch{}
  return null;
}

async function wiki(query){
  try{
    const s = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&srlimit=1&origin=*`)).json();
    const hit = s?.query?.search?.[0];
    if(!hit) return null;
    const sum = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(hit.title)}`)).json();
    if(!sum.extract) return null;
    return {title:sum.title, body:sum.extract, src:"Wikipedia", url:sum.content_urls?.desktop?.page, img:sum.thumbnail?.source||null};
  }catch{}
  return null;
}

async function gemma(query){
  try{
    const res = await fetch(ANSWER_PROXY, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:query})});
    if(!res.ok) return null;
    const d = await res.json();
    const a = (d.answer||"").trim();
    if(a && a.toUpperCase()!=="UNKNOWN") return {title:query, body:a, src:"Nimble AI"};
  }catch{}
  return null;
}

async function search(query){
  if(!query) return;
  const esc = t => t.replace(/</g,"&lt;");
  const c = tryConvert(query);
  if(c){ render(`<h2>${esc(query)}</h2><div class="big">${c.to} ${esc(c.toUnit)}</div><p>${c.from} ${esc(c.fromUnit)}</p>`); return; }
  const m = tryMath(query);
  if(m !== null){ render(`<h2>${esc(query)}</h2><div class="big">${m}</div>`); return; }
  loading(); go.disabled = true;
  try{
    const ge = graphExpr(query), svg = ge && await graph(ge);
    if(svg){ render(`${svg}<h2>y = ${esc(ge)}</h2><div class="src">Source: Curvely</div>`); return; }
    // A model's number is an unsourced guess: for numeric answers prefer DDG when it has one.
    const [ai, dd] = await Promise.all([gemma(query), ddg(query)]);
    const hit = (ai && /\d/.test(ai.body) && dd) ? dd : (ai || dd || await wiki(query));
    if(hit){
      render(`${hit.img?`<img src="${hit.img}" alt="">`:""}<h2>${hit.title.replace(/</g,"&lt;")}</h2><p>${hit.body.replace(/</g,"&lt;")}</p>`
        + `<div class="src">Source: ${hit.url?`<a href="${hit.url}" target="_blank" rel="noopener">${hit.src}</a>`:hit.src}</div>`);
    } else {
      render(`<p>No instant answer found. <a class="src" href="https://duckduckgo.com/?q=${encodeURIComponent(query)}" target="_blank" rel="noopener" style="color: var(--link, var(--accent))">Search the web →</a></p>`);
    }
  } finally { go.disabled = false; }
}

$("#f").addEventListener("submit", e => { e.preventDefault(); search(q.value.trim()); });

addEventListener("load", () => setTimeout(() => $("#splash").classList.add("hide"), 250));
addEventListener("load", () => navigator.serviceWorker?.register("/app/sw.js"));
</script>
</body>
</html>
