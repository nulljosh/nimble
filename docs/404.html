<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found, Nimble</title>
<meta name="theme-color" content="#ffca30">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/tokens.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; min-height: 100svh; padding: 1.5rem;
  display: grid; place-items: center;
  background: var(--yellow); color: #000;
  font-family: var(--font); text-align: center;
}
main { display: grid; justify-items: center; gap: 1.5rem; }
/* Yellow bird on the yellow page: the same ink outline as the landing hero. */
main img {
  width: 160px; height: 160px; display: block;
  filter: drop-shadow(2.5px 0 0 #1f1b16) drop-shadow(-2.5px 0 0 #1f1b16)
          drop-shadow(0 2.5px 0 #1f1b16) drop-shadow(0 -2.5px 0 #1f1b16)
          drop-shadow(1.8px 1.8px 0 #1f1b16) drop-shadow(-1.8px 1.8px 0 #1f1b16)
          drop-shadow(1.8px -1.8px 0 #1f1b16) drop-shadow(-1.8px -1.8px 0 #1f1b16);
}
h1 { font-size: clamp(1.25rem, 4vw, 1.6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
a { color: #000; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img src="/mascot/flit.svg" width="160" height="160" alt="Flit, Nimble's hummingbird">
  <h1><a href="/app">Nothing here. Ask me something instead.</a></h1>
</main>
</body>
</html>
