<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nimble</title>
<meta name="description" content="Ask a question. Get one sentence back.">
<meta name="theme-color" content="">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="tokens.css">
<style>
@font-face{font-family:"Nimble Sans";src:url("fonts/NimbleSans-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Nimble Sans";src:url("fonts/NimbleSans-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Nimble Sans";src:url("fonts/NimbleSans-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Nimble Sans";src:url("fonts/NimbleSans-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  -webkit-font-smoothing: antialiased; line-height: var(--lh-md);
  display: flex; flex-direction: column; min-height: 100svh;
}
a { color: inherit; }
.top {
  display: flex; flex-wrap: wrap; row-gap: var(--space-2); align-items: center; justify-content: space-between;
  padding: max(var(--space-4), env(safe-area-inset-top)) var(--gutter) var(--space-4);
}
.brand { min-height: 44px; display: flex; align-items: center; gap: var(--space-3); font-weight: 700; font-size: var(--fs-17); letter-spacing: var(--tracking-tight); text-decoration: none; }
.brand img { width: 30px; height: 30px; border-radius: var(--radius-sm); }
.top nav a { font-size: var(--fs-15); color: var(--text-mid); text-decoration: none; margin-left: var(--space-4); }
.top nav a:hover, .top nav button:hover { color: var(--text); }
.top nav button { border: 0; background: none; font: inherit; font-size: var(--fs-15); color: var(--text-mid); margin-left: var(--space-4); cursor: pointer; }
/* Nav items stay on one line; on a narrow phone the nav drops under the brand, right-aligned. */
.top nav { display: flex; align-items: center; white-space: nowrap; margin-left: auto; }
.top nav a, .top nav button { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; }
@media (max-width: 480px) { .top nav a, .top nav button { margin-left: var(--space-3); } }

main { flex: 1; width: 100%; max-width: var(--max-app); margin: 0 auto; padding: var(--space-8) var(--gutter) var(--space-7); }
h1 { font-size: var(--fs-28); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-xl); margin-bottom: var(--space-5); text-align: center; }

form { position: relative; }
.field {
  display: flex; align-items: center; gap: var(--space-3);
  background: var(--color-bg2); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: var(--space-1) var(--space-4);
}
.field svg { flex: none; }
.field input {
  flex: 1; min-width: 0; min-height: 44px; border: 0; background: none;
  font: inherit; font-size: var(--fs-17); color: var(--text);
}
/* The ring sits on the whole field, not the text inside it. */
.field input:focus-visible { outline: none; }
.field:focus-within { border-color: var(--yellow-deep); box-shadow: 0 0 0 2px var(--yellow-deep); }
:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }
.field input::placeholder { color: var(--text-light); }
.mic {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 calc(-1 * var(--space-1)); padding: 0;
  border: 0; border-radius: var(--radius-sm); background: none; color: var(--text-light); cursor: pointer;
}
.mic:hover { color: var(--text); }
.mic.on { color: var(--yellow-deep); }
.go {
  flex: none; min-height: 44px; border: 0; border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); cursor: pointer;
  background: var(--yellow); color: var(--black); font: inherit; font-weight: 700; font-size: var(--fs-15);
}

.card { margin-top: var(--space-5); padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-lg); min-height: 120px; }
.card[hidden] { display: none; }
.card.swap { animation: in 400ms cubic-bezier(.22,1,.36,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.mockup-label { font-size: var(--fs-13); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--yellow-deep); margin-bottom: var(--space-3); }
.mockup-big { font-size: var(--fs-34); font-weight: 600; letter-spacing: -0.02em; line-height: var(--lh-2xl); margin-bottom: var(--space-2); overflow-wrap: anywhere; }
.card p { font-size: var(--fs-22); line-height: var(--lh-lg); color: var(--text); }
.card h3 { font-size: var(--fs-15); font-weight: 700; letter-spacing: -0.02em; color: var(--text-mid); margin-bottom: var(--space-2); }
.card svg { width: 100%; height: auto; color: var(--yellow-deep); }
.mockup-link { display: block; text-decoration: none; }
.mockup-icon { display: block; width: 24px; height: 24px; border-radius: var(--radius-sm); margin-bottom: var(--space-2); }
.mockup-link p { text-decoration: none; color: var(--text); }
.mockup-link:hover p { text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 4px; }
.sources { margin: var(--space-3) 0 0; font-size: var(--fs-13); color: var(--text-mid); }
.sources a { display: inline-block; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.mockup-card p { text-decoration: none; color: var(--text-mid); }
.mockup-card:hover p { text-decoration: underline; }
.consent-actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); }
.consent-actions button { min-height: 44px; border: 1px solid var(--line); background: none; color: var(--text); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); font: inherit; font-weight: 700; font-size: var(--fs-15); cursor: pointer; }
.consent-actions .consent-yes { border-color: transparent; background: var(--yellow); color: var(--black); }
.consent-actions .consent-no:hover { border-color: var(--yellow-deep); }
.credit { margin-top: var(--space-4); font-size: var(--fs-13); color: var(--text-light); display: flex; align-items: baseline; gap: var(--space-4); }
.credit button { border: 0; background: none; padding: var(--tap-pad) 0; margin-block: calc(var(--tap-pad) * -1); font: inherit; color: var(--text-mid); cursor: pointer; text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.credit button:hover { color: var(--text); }
/* Why this answer: the source line is the toggle; the text it came from opens under it. */
.news { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; gap: var(--space-4); }
.news li { line-height: var(--lh-md); }
.num { font-variant-numeric: tabular-nums; }
.news a { display: inline-block; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.news-src { display: block; font-size: var(--fs-13); color: var(--text-light); margin-top: var(--space-1); }
.market-title { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.market-price { font-size: var(--fs-22); line-height: var(--lh-lg); font-weight: var(--fw-semibold); margin: var(--space-1) 0 0; }
.market-change { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: var(--space-1) 0 0; }
.market-state { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.as-of { margin: var(--space-3) 0 0; font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-light); }
/* Rich results: a photo tops a card (16:9, 12px radius); a news story can carry a 56px square. */
.mockup-photo { display: block; aspect-ratio: var(--ratio-photo); border-radius: var(--radius-photo); overflow: hidden; background: var(--bg2); margin: 0 0 var(--space-4); }
.mockup-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; opacity: 0; transition: opacity .25s ease; }
.mockup-photo img.on { opacity: 1; }
.photo-credit { display: block; margin: calc(var(--space-4) * -1) 0 var(--space-4); font-size: var(--fs-13); color: var(--text-light); }
.news li.has-thumb { display: grid; grid-template-columns: 56px 1fr; gap: var(--space-3); align-items: start; }
.news-thumb { width: 56px; height: 56px; border-radius: var(--radius-md); object-fit: cover; background: var(--bg2); opacity: 0; transition: opacity .25s ease; }
.news-thumb.on { opacity: 1; }
.ai-note { margin: var(--space-3) 0 0; font-size: var(--fs-13); color: var(--text-light); }
.why { margin-top: var(--space-4); font-size: var(--fs-13); color: var(--text-light); }
.why summary { display: inline-block; cursor: pointer; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; list-style: none; }
.why summary::-webkit-details-marker { display: none; }
.why summary::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 0 var(--space-1) var(--space-2); border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); vertical-align: middle; }
.why[open] summary::after { transform: rotate(-135deg); margin-bottom: 0; }
.why.steps ol { margin: var(--space-2) 0 0; padding: 0; list-style: none; counter-reset: step; }
.why.steps li { counter-increment: step; margin: 0 0 var(--space-1); }
.why.steps li::before { content: counter(step) "."; display: inline-block; width: 22px; color: var(--text-light); font-variant-numeric: tabular-nums; }
.card .why p { font-size: var(--fs-17); line-height: var(--lh-md); color: var(--text-mid); margin-top: var(--space-3); }
.why a { display: inline-block; padding-block: var(--tap-pad); margin-top: calc(var(--space-2) - var(--tap-pad)); margin-bottom: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
/* The card sets every paragraph to the 22px answer size. These lines sit under the answer, so they set their own. */
.card .sources { font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); }
.card .ai-note { font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-light); }
.card .thinking p { font-size: var(--fs-17); color: var(--text-mid); }
/* Consent: the question is the headline, the explanation reads as body copy. */
.card .consent-q { font-size: var(--fs-22); line-height: var(--lh-lg); letter-spacing: -0.01em; font-weight: var(--fw-semibold); color: var(--text); margin-bottom: var(--space-2); }
.card .consent-copy { font-size: var(--fs-17); line-height: var(--lh-md); color: var(--text-mid); }

.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; margin-top: var(--space-5); }
.chips[hidden] { display: none; }
.chips button {
  min-height: 44px; border: 1px solid var(--line); background: none; color: var(--text-mid); border-radius: 999px;
  padding: var(--space-2) var(--space-3); font: inherit; font-size: var(--fs-15); cursor: pointer;
}
.chips button:hover { color: var(--text); border-color: var(--yellow-deep); }
.recent { margin-top: var(--space-5); }
.recent[hidden] { display: none; }
.recent-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: var(--space-2); }
.recent-head .mockup-label { margin-bottom: 0; }
.recent-head button { border: 0; background: none; font: inherit; font-size: var(--fs-13); color: var(--text-light); cursor: pointer; padding: var(--tap-pad) 0; margin-block: calc(var(--tap-pad) * -1); }
.recent-head button:hover { color: var(--text); }
.recent-list { list-style: none; }
.recent-list button {
  display: block; width: 100%; min-height: 44px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
  font: inherit; font-size: var(--fs-17); color: var(--text-mid); padding: var(--space-3) 0; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent-list button:hover { color: var(--text); }
.hint { text-align: left; font-size: var(--fs-13); color: var(--text-mid); margin-top: var(--space-6); }
.flit { display: block; width: 96px; height: 96px; margin: var(--space-5) auto 0; opacity: 0.9; }
.flit[hidden] { display: none; }
/* While an answer is on its way, Flit hums in the card: wing beat plus a bob. Stops the moment
   the answer replaces her. Off under reduced motion. */
.thinking { display: flex; align-items: center; gap: var(--space-4); }
.thinking svg { flex: none; width: 72px; height: 72px; overflow: visible; animation: flit-bob 1.2s ease-in-out infinite alternate; }
.thinking .flit-wing { transform-box: fill-box; transform-origin: 90% 10%; animation: flit-flap 0.22s ease-in-out infinite alternate; }
.thinking .flit-eye { transform-box: fill-box; transform-origin: center; animation: flit-blink 4s ease-in-out infinite; }
@keyframes flit-bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@keyframes flit-flap { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
@keyframes flit-blink { 0%, 100% { transform: scaleY(1); } 2% { transform: scaleY(0.1); } 4% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .thinking svg, .thinking .flit-wing, .thinking .flit-eye { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="icon-512.png" alt="">Nimble</a>
  <nav><button type="button" id="ai" aria-live="polite"></button><button type="button" id="mascot"></button><a href="/#install" data-i18n="Get the app">Get the app</a><a href="https://github.com/nulljosh/nimble" data-i18n="Source">Source</a></nav>
</header>
<main>
  <h1 data-i18n="Ask anything.">Ask anything.</h1>
  <form id="f" autocomplete="off">
    <label class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="color:var(--yellow-deep)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="text" enterkeyhint="go" aria-label="Ask Nimble" data-i18n-aria-label="Ask Nimble" placeholder="define nimble" autofocus spellcheck="false">
      <button class="go" type="submit" data-i18n="Ask">Ask</button>
    </label>
  </form>
  <section class="card" id="r" aria-live="polite" hidden></section>
  <img class="flit" id="flit" src="mascot/flit.svg" width="96" height="96" alt="Flit, Nimble's hummingbird">
  <div class="chips" id="chips"></div>
  <section class="recent" id="recent" aria-label="Recent searches" data-i18n-aria-label="Recent searches" hidden>
    <div class="recent-head"><div class="mockup-label" data-i18n="Recent">Recent</div><button type="button" id="clear" data-i18n="Clear">Clear</button></div>
    <ul class="recent-list" id="recent-list"></ul>
  </section>
  <p class="hint" data-i18n="Math, units and graphs work offline. Everything else gets one sentence and a source.">Math, units and graphs work offline. Everything else gets one sentence and a source.</p>
  <img id="shareDebug" alt="" style="display:block;width:100%;margin-top:var(--space-5)">
</main>
<script src="i18n.js"></script>
<script src="engine.js?v=offline"></script>
<script>
document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bulb').trim();
// The two mascots. Flit is the default; Fen is the fennec from docs/mascot/fen.svg, inlined so the
// empty state and the loading card work offline too.
var FLIT='<svg viewBox="0 0 240 240" aria-hidden="true" focusable="false"><ellipse cx="56" cy="178" rx="26" ry="11" transform="rotate(-38 56 178)" style="fill:var(--bulb-deep)"/><ellipse cx="72" cy="194" rx="24" ry="10" transform="rotate(-60 72 194)" style="fill:var(--bulb-deep)"/><ellipse cx="110" cy="106" rx="11" ry="26" transform="rotate(44 110 106)" opacity="0.5" style="fill:var(--bulb-deep)"/><ellipse cx="108" cy="154" rx="54" ry="46" style="fill:var(--bulb)"/><path d="M66 168 C 82 194, 138 196, 158 170 C 144 182, 90 184, 66 168 Z" style="fill:var(--flit-belly)"/><circle cx="156" cy="104" r="52" style="fill:var(--bulb)"/><path d="M146 54 C 142 40, 152 30, 162 36 C 154 38, 150 46, 152 56 Z" style="fill:var(--bulb-deep)"/><circle cx="180" cy="126" r="9" opacity="0.35" style="fill:var(--flit-cheek)"/><path d="M203 98 L232 108 L203 118 Z" stroke-width="5" stroke-linejoin="round" style="fill:var(--bulb-deep);stroke:var(--bulb-deep)"/><g class="flit-eye"><circle cx="170" cy="100" r="18" style="fill:var(--black)"/><circle cx="176" cy="93" r="6.5" style="fill:var(--flit-glint)"/><circle cx="164" cy="108" r="3" style="fill:var(--flit-glint)"/></g><g class="flit-wing"><ellipse cx="84" cy="138" rx="16" ry="38" transform="rotate(40 84 138)" style="fill:var(--bulb-deep)"/><ellipse cx="88" cy="142" rx="8" ry="26" transform="rotate(40 88 142)" style="fill:var(--flit-wing)"/></g></svg>';
var FEN='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true" focusable="false"><path style="fill:var(--bulb-deep)" d="M60 196 C 30 190, 26 160, 48 152 C 44 172, 60 180, 82 178 Z" /><circle style="fill:var(--flit-belly)" cx="48" cy="156" r="10" /><ellipse style="fill:var(--bulb)" cx="120" cy="178" rx="48" ry="36" /><ellipse style="fill:var(--flit-belly)" cx="120" cy="190" rx="28" ry="18" /><path style="fill:var(--bulb)" d="M74 118 C 50 60, 62 30, 84 36 C 98 44, 104 90, 100 122 Z" /><path style="fill:var(--flit-cheek)" d="M80 112 C 66 70, 72 48, 84 48 C 92 56, 96 92, 94 118 Z"  opacity="0.45"/><path style="fill:var(--bulb)" d="M166 118 C 190 60, 178 30, 156 36 C 142 44, 136 90, 140 122 Z" /><path style="fill:var(--flit-cheek)" d="M160 112 C 174 70, 168 48, 156 48 C 148 56, 144 92, 146 118 Z"  opacity="0.45"/><circle style="fill:var(--bulb)" cx="120" cy="120" r="50" /><ellipse style="fill:var(--flit-belly)" cx="120" cy="140" rx="24" ry="16" /><circle style="fill:var(--flit-cheek)" cx="86" cy="134" r="8"  opacity="0.35"/><circle style="fill:var(--flit-cheek)" cx="154" cy="134" r="8"  opacity="0.35"/><circle style="fill:var(--black)" cx="100" cy="112" r="14" /><circle style="fill:var(--flit-glint)" cx="105" cy="106" r="5" /><circle style="fill:var(--black)" cx="140" cy="112" r="14" /><circle style="fill:var(--flit-glint)" cx="145" cy="106" r="5" /><path style="fill:var(--black);stroke:var(--black)" d="M112 136 L128 136 L120 146 Z"   stroke-width="3" stroke-linejoin="round"/></svg>';
// The empty-state image: a data URI for Fen (no network, works offline), the file for Flit.
function paintMascotImg(){
  var fen=mascot()==='fen', el=document.getElementById('flit');
  el.src=fen?'data:image/svg+xml,'+encodeURIComponent(FEN):'mascot/flit.svg';
  el.alt=fen?"Fen, Nimble's fennec":"Flit, Nimble's hummingbird";
}
paintMascotImg();
// Everything below speaks the visitor's language, so it starts once the locale has loaded.
I18N.ready.then(function(){
var T=I18N.t;
  var f=document.getElementById('f'), q=document.getElementById('q'), r=document.getElementById('r'), chips=document.getElementById('chips');
  var last=null, shot=location.search.indexOf('share=1')>-1; // last: the answer on screen, for Share. shot: screenshots only
  var hist=searchHistory, recent=document.getElementById('recent'), recentList=document.getElementById('recent-list'), flit=document.getElementById('flit');
  // Flit is part of the empty state only: no answer on screen and no recent searches, so the TRY chips are up.
  function paintFlit(){ flit.hidden=!r.hidden||!recent.hidden; }
  // Recent searches replace the suggestion chips once there is any history. textContent only, never HTML.
  function paintRecent(){
    var items=hist.list().slice(0,8);
    recent.hidden=!items.length; chips.hidden=items.length>0; paintFlit();
    recentList.textContent='';
    items.forEach(function(e){
      var li=document.createElement('li'), b=document.createElement('button');
      b.type='button'; b.textContent=e.q; b.title=e.q; b.onclick=function(){ run(e.q); };
      li.appendChild(b); recentList.appendChild(li);
    });
  }
  document.getElementById('clear').addEventListener('click',function(){ hist.clear(); paintRecent(); });
  async function run(query){
    query=(query||q.value||q.placeholder).trim(); if(!query) return;
    q.value=query; r.hidden=false; paintFlit();
    r.innerHTML='<div class="mockup-label">'+T('Answer')+'</div><div class="thinking">'+(mascot()==='fen'?FEN:FLIT)+'<p>'+T('Thinking…')+'</p></div>';
    // Shareable: /app?q=... opens straight onto the answer.
    history.replaceState(null,'','?q='+encodeURIComponent(query));
    var res=await renderAnswer(query,{t:T});
    if(q.value.trim()!==query) return;  // a newer question already went out
    r.classList.remove('swap'); void r.offsetWidth; r.classList.add('swap');
    last={q:query, a:res.a};
    var share=shareText(res.a)?'<button type="button" data-share>'+T('Share')+'</button>':'';
    r.innerHTML=res.h+(res.credit||share?'<div class="credit">'+(res.credit?'<span>'+res.credit+'</span>':'')+share+'</div>':'');
    if(shot) shareImage(query,res.a).then(function(b){ if(b) document.getElementById('shareDebug').src=URL.createObjectURL(b); }); // screenshots only
    if(['consent','none','offline'].indexOf(res.kind)<0){ hist.add(query); paintRecent(); }
  }
  // Share sheet with the PNG where the browser can, a download of nimble-answer.png where it can't.
  async function shareAnswer(){
    if(!last) return;
    try{
      var blob=await shareImage(last.q,last.a); if(!blob) return;
      var file=new File([blob],'nimble-answer.png',{type:'image/png'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file]}); return; }
        catch(err){ if(err && err.name==='AbortError') return; }
      }
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download='nimble-answer.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    }catch(err){}
  }
  f.addEventListener('submit',function(e){ e.preventDefault(); run(); });
  // Voice, only where the browser can listen. Words stream into the field; when it stops, the question runs.
  // Every failure, a denied mic included, just puts the button back to idle.
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    var mic=document.createElement('button'), rec=null, usual=null;
    mic.type='button'; mic.className='mic';
    mic.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
    f.querySelector('.go').before(mic);
    var paintMic=function(state){
      var l=listenLabel(state);
      mic.classList.toggle('on',state==='listening');
      mic.setAttribute('aria-pressed',state==='listening'?'true':'false');
      mic.setAttribute('aria-label',T(l.button)); mic.title=T(l.button);
      if(l.placeholder){ if(usual===null) usual=q.placeholder; q.placeholder=T(l.placeholder); }
      else if(usual!==null){ q.placeholder=usual; usual=null; }
    };
    paintMic('idle');
    mic.addEventListener('click',function(){
      if(rec){ try{ rec.stop(); }catch(err){} return; }
      var heard='';
      try{
        var s=new SR();
        s.lang=navigator.language||'en-US'; s.interimResults=true; s.continuous=false; s.maxAlternatives=1;
        s.onresult=function(e){
          var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
          heard=t.trim(); q.value=heard;
        };
        s.onerror=function(e){ if(e && e.error!=='no-speech' && e.error!=='network') heard=''; };
        s.onend=function(){ rec=null; paintMic('idle'); if(heard) run(heard); };
        rec=s; s.start(); paintMic('listening');
      }catch(err){ rec=null; paintMic('idle'); }
    });
  }
  // AI switch: on = the model may answer, off = DuckDuckGo and Wikipedia only, ask = not chosen yet.
  var ai=document.getElementById('ai');
  function paintAI(){
    var c=aiConsent();
    ai.textContent=T(c==='yes'?'AI: on':c==='no'?'AI: off':'AI: ask');
    ai.title=T(c===null?'Not chosen yet. Click to choose.':c==='yes'?'Click to turn AI answers off':'Click to turn AI answers on');
  }
  paintAI();
  ai.addEventListener('click',function(){
    var c=aiConsent();
    if(c===null){ r.hidden=false; paintFlit(); r.classList.remove('swap'); void r.offsetWidth; r.classList.add('swap'); r.innerHTML=consentHTML(aiRecipient(),T); return; }
    aiConsent(c==='yes'?'no':'yes'); paintAI();
  });
  // Mascot switch: Flit or Fen. Repaints the empty state at once; the next loading card picks it up too.
  var mascotBtn=document.getElementById('mascot');
  function paintMascot(){
    mascotBtn.textContent=T('Mascot: {s}',{s:mascot()==='fen'?'Fen':'Flit'});
    paintMascotImg();
  }
  paintMascot();
  mascotBtn.addEventListener('click',function(){ mascot(mascot()==='fen'?'flit':'fen'); paintMascot(); });
  // The consent card lives inside the result; Allow and Don't allow re-run the same question.
  r.addEventListener('click',function(e){
    if(e.target.closest('[data-share]')){ shareAnswer(); return; }
    var b=e.target.closest('[data-consent]'); if(!b) return;
    aiConsent(b.dataset.consent); paintAI();
    if(q.value.trim()) run(q.value); else { r.hidden=true; paintFlit(); }
  });
  fetch('suggestions.json').then(function(x){return x.json();}).then(function(list){
    list.sort(function(){return Math.random()-0.5;}).slice(0,6).forEach(function(s){
      var b=document.createElement('button'); b.type='button'; b.textContent=s;
      b.onclick=function(){ run(s); }; chips.appendChild(b);
    });
    q.placeholder=list[6]||q.placeholder;
  }).catch(function(){});
  if(location.search.indexOf('seed=1')>-1) ['5 miles to km','capital of Canada','sqrt(144)'].forEach(function(s){ hist.add(s); }); // screenshots only
  paintRecent();
  var start=new URLSearchParams(location.search).get('q'); if(start) run(start);
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
