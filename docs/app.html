<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nimble</title>
<meta name="description" content="Ask a question. Get one sentence back.">
<meta name="theme-color" content="">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="tokens.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  -webkit-font-smoothing: antialiased; line-height: var(--lh-md);
  display: flex; flex-direction: column; min-height: 100svh;
}
a { color: inherit; }
/* Header: one row, fixed height from the tokens. Phones fold the links into a sheet behind one 44px button. */
.top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  min-height: var(--header-h); padding: max(var(--space-2), env(safe-area-inset-top)) var(--gutter) var(--space-2); }
.brand { min-height: var(--tap); display: flex; align-items: center; gap: var(--space-3); font-weight: 700; font-size: var(--fs-17); letter-spacing: var(--tracking-tight); text-decoration: none; }
.brand img { width: 30px; height: 30px; border-radius: var(--radius-sm); }
.top nav a, .top nav button { display: flex; align-items: center; min-height: var(--tap); padding: 0; border: 0; background: none; font: inherit; font-size: var(--fs-15); color: var(--text-mid); text-decoration: none; cursor: pointer; }
.top nav a:hover, .top nav button:hover { color: var(--text); }
/* display:flex above beats the hidden attribute, so Download and Remove offline pack both showed at once. */
.top nav button[hidden] { display: none; }
/* The offline pack buttons are long labels; the header keeps every tap target at 44px or more. */
.top nav #ai, .top nav #private, .top nav #mascot, .top nav #pack-get, .top nav #pack-drop { flex: none; white-space: nowrap; }
.menu-btn { display: grid; place-items: center; flex: none; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--radius-sm); background: none; color: var(--text); cursor: pointer; }
.menu-btn:hover { color: var(--yellow-deep); }
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn[aria-expanded="true"] { color: var(--yellow-deep); }
/* Phone: the links sit in a full-width sheet under the header. Hidden until the menu button opens it. */
/* The open sheet is opaque (bg2 surface, hairline edge, soft radius), so nothing under it shows through. Rows are full width, 44px. */
.top nav { display: none; position: absolute; top: calc(100% + var(--space-2)); left: var(--gutter); right: var(--gutter); z-index: 5; flex-direction: column; align-items: stretch;
  padding: var(--space-2) 0; background: var(--color-bg2); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.top.open { z-index: 6; background: var(--bg); }
.top.open nav { display: flex; }
.top nav > * { width: 100%; min-height: var(--tap); padding: 0 var(--space-4); justify-content: flex-start; text-align: left; }
.top nav > * + * { border-top: 1px solid var(--line); }
/* The scrim dims the page under the sheet and closes the menu on tap. It sits under the header, which stays above it. */
.scrim { display: none; position: fixed; inset: 0; z-index: 4; background: rgba(0, 0, 0, 0.4); }
.top.open ~ .scrim { display: block; }
@media (min-width: 640px) {
  .menu-btn { display: none; }
  .top nav { display: flex; position: static; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--space-2) var(--space-4); margin-left: auto; padding: 0; background: none; border: 0; border-radius: 0; }
  .top nav > * { width: auto; min-height: var(--tap); padding: 0; }
  .top nav > * + * { border-top: 0; }
  .top.open { z-index: auto; background: none; }
  .top.open ~ .scrim { display: none; }
}

main { flex: 1; width: 100%; max-width: var(--max-app); margin: 0 auto; padding: var(--space-6) var(--gutter) var(--space-7); }
h1 { font-size: var(--fs-28); font-weight: 700; letter-spacing: var(--tracking-tight); line-height: var(--lh-xl); margin-bottom: var(--space-5); text-align: center; }

/* The page heading for screen readers; sighted users get the placeholder questions instead. */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
form { position: relative; }
.field {
  display: flex; align-items: center; gap: var(--space-3);
  /* Liquid glass: translucent, blurred, a bright top edge and a soft drop shadow. */
  background: color-mix(in srgb, var(--color-bg2) 60%, transparent); border: 1px solid var(--line); border-radius: 999px;
  -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(0,0,0,.08);
  padding: var(--space-1) var(--space-1) var(--space-1) var(--space-4);
}
@media (prefers-color-scheme: dark) { .field { box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 24px rgba(0,0,0,.35); } }
.field svg { flex: none; }
.field input {
  flex: 1; min-width: 0; min-height: 44px; border: 0; background: none;
  font: inherit; font-size: var(--fs-17); color: var(--text);
}
/* The ring sits on the whole field, not the text inside it. */
.field input:focus-visible { outline: none; }
.field:focus-within { border-color: var(--yellow-deep); box-shadow: 0 0 0 2px var(--yellow-deep), 0 8px 24px rgba(0,0,0,.08); }
:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }
.field input::placeholder { color: var(--text-light); text-overflow: ellipsis; }
.mic {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 calc(-1 * var(--space-1)); padding: 0;
  border: 0; border-radius: var(--radius-sm); background: none; color: var(--text-light); cursor: pointer;
}
.mic:hover { color: var(--text); }
.mic.on { color: var(--yellow-deep); }
.go {
  flex: none; min-height: 48px; border: 0; border-radius: 999px; padding: 0 var(--space-4); cursor: pointer;
  background: var(--yellow); color: var(--black); font: inherit; font-weight: 700; font-size: var(--fs-15);
}

.card { margin-top: var(--space-5); padding: var(--space-5); border: 1px solid var(--line); border-radius: 28px; min-height: 120px; }
.card[hidden] { display: none; }
.card.swap { animation: in 400ms cubic-bezier(.22,1,.36,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.mockup-label { font-size: var(--fs-13); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--yellow-deep); margin-bottom: var(--space-3); }
.mockup-big { font-size: var(--fs-34); font-weight: 600; letter-spacing: -0.02em; line-height: var(--lh-2xl); margin-bottom: var(--space-2); overflow-wrap: anywhere; }
.card p { font-size: var(--fs-22); line-height: var(--lh-lg); color: var(--text); }
.card h3 { font-size: var(--fs-15); font-weight: 700; letter-spacing: -0.02em; color: var(--text-mid); margin-bottom: var(--space-2); }
.card svg { width: 100%; height: auto; color: var(--yellow-deep); }
.mockup-link { display: block; text-decoration: none; }
.mockup-icon { display: block; width: 24px; height: 24px; border-radius: var(--radius-sm); margin-bottom: var(--space-2); }
.mockup-link p { text-decoration: none; color: var(--text); }
.mockup-link:hover p { text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 4px; }
.sources { margin: var(--space-3) 0 0; font-size: var(--fs-13); color: var(--text-mid); }
.sources a { display: inline-block; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.mockup-card p { text-decoration: none; color: var(--text-mid); }
.mockup-card:hover p { text-decoration: underline; }
.credit { margin-top: var(--space-4); font-size: var(--fs-13); color: var(--text-mid); display: flex; align-items: baseline; gap: var(--space-4); }
.credit button { min-width: var(--tap); border: 0; background: none; padding: var(--tap-pad) var(--space-2); margin-block: calc(var(--tap-pad) * -1); font: inherit; color: var(--text-mid); cursor: pointer; text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.credit button:hover { color: var(--text); }
/* Why this answer: the source line is the toggle; the text it came from opens under it. */
.news { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; gap: var(--space-4); }
.news li { line-height: var(--lh-md); }
.num { font-variant-numeric: tabular-nums; }
.news a { display: inline-block; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.news-src { display: block; font-size: var(--fs-13); color: var(--text-light); margin-top: var(--space-1); }
.market-title { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.market-price { font-size: var(--fs-22); line-height: var(--lh-lg); font-weight: var(--fw-semibold); margin: var(--space-1) 0 0; }
.market-change { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: var(--space-1) 0 0; }
.market-state { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.sports-title { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.sports-score { font-size: var(--fs-22); line-height: var(--lh-lg); font-weight: var(--fw-regular); margin: var(--space-1) 0 0; }
.sports-score strong { font-weight: var(--fw-bold); }
.sports-status { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: var(--space-1) 0 0; }
.sports-state { font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.sports-rows { display: grid; gap: var(--space-3); }
/* .card p sets every answer paragraph to 22px; the small lines below are scoped under .card so they keep their own size. */
.card .as-of { font-size: var(--fs-13); line-height: var(--lh-md); }
.card .market-title, .card .market-change, .card .market-state, .card .sports-title, .card .sports-status, .card .sports-state { font-size: var(--fs-15); line-height: var(--lh-md); }
.as-of { margin: var(--space-3) 0 0; font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-light); }
/* Rich results: a photo tops a card (16:9, 12px radius); a news story can carry a 56px square. */
.mockup-photo { display: block; aspect-ratio: var(--ratio-photo); border-radius: var(--radius-photo); overflow: hidden; background: var(--bg2); margin: 0 0 var(--space-4); }
.mockup-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; opacity: 0; transition: opacity .25s ease; }
.mockup-photo img.on { opacity: 1; }
.photo-credit { display: block; margin: calc(var(--space-4) * -1) 0 var(--space-4); font-size: var(--fs-13); color: var(--text-light); }
.news li.has-thumb { display: grid; grid-template-columns: 56px 1fr; gap: var(--space-3); align-items: start; }
.news-thumb { width: 56px; height: 56px; border-radius: var(--radius-md); object-fit: cover; background: var(--bg2); opacity: 0; transition: opacity .25s ease; }
.news-thumb.on { opacity: 1; }
.ai-note { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-3) 0 0; font-size: var(--fs-13); color: var(--text-light); }
/* Lead lines sit directly under the card header: the resting note, then the background caption. */
.ai-note img { flex: none; border-radius: 50%; }
.card .ai-note, .card .bg-caption, .bg-caption { margin: 0 0 var(--space-2); font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); }
/* The tools row under the field: History always, New question once an answer is on screen. */
.tools { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-4); }
.tools[hidden], .tools button[hidden] { display: none; }
.tools button { min-height: 48px; padding: 0 var(--space-4); border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text-mid); font: inherit; font-size: var(--fs-15); font-weight: var(--fw-semibold); cursor: pointer; }
.tools button:hover { color: var(--text); border-color: var(--yellow-deep); }
/* History: a full-screen dialog. Rows re-ask on tap; Edit adds a 24px circle per row and a bottom bar. */
.hist { inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--text); overflow: hidden; }
.hist[open] { display: flex; flex-direction: column; }
.hist::backdrop { background: var(--bg); }
.hist-inner { flex: 1; min-height: 0; width: 100%; max-width: var(--max-app); margin: 0 auto; display: flex; flex-direction: column; padding: max(var(--space-2), env(safe-area-inset-top)) var(--gutter) 0; }
.hist-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--tap); }
.hist-title { font-size: var(--fs-22); line-height: var(--lh-lg); font-weight: var(--fw-semibold); letter-spacing: -0.01em; text-align: center; }
.hist-head button { min-width: var(--tap); min-height: var(--tap); padding: 0 var(--space-2); border: 0; background: none; color: var(--text-mid); font: inherit; font-size: var(--fs-15); cursor: pointer; }
.hist-head button:hover { color: var(--text); }
.hist-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: var(--space-4); }
.hist-empty { font-size: var(--fs-17); line-height: var(--lh-md); color: var(--text-mid); margin-top: var(--space-5); text-align: center; }
.hist-list { list-style: none; border-top: 1px solid var(--line); }
.hist-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.hist-ask { flex: 1; min-width: 0; min-height: var(--tap); padding: var(--space-3) 0; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.hist-ask:hover .hist-q { text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.hist-text { display: block; flex: 1; min-width: 0; }
.hist-q { display: block; font-size: var(--fs-15); line-height: var(--lh-md); color: var(--text); overflow-wrap: anywhere; }
.hist-snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: var(--space-1); font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); }
.hist-when { display: block; margin-top: var(--space-1); font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); }
.hist-del { flex: none; align-self: center; min-width: var(--tap); min-height: var(--tap); padding: 0 var(--space-2); border: 0; background: none; color: var(--text-mid); font: inherit; font-size: var(--fs-15); cursor: pointer; text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
.hist-del:hover { color: var(--text); }
.hist-pick { position: relative; flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: var(--space-2); min-height: var(--tap); padding: var(--space-3) 0; cursor: pointer; }
/* The selection circle: a 24px ring with a 12px radius (round), filled accent with a check when picked.
   The 44px box around it is the tap target: the checkbox is laid over the whole box, transparent. */
.hist-box { position: relative; flex: none; display: grid; place-items: center; width: var(--tap); height: var(--tap); }
.hist-box input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.hist-dot { position: relative; width: 24px; height: 24px; border: 1.5px solid var(--text-light); border-radius: var(--radius-md); pointer-events: none; }
.hist-dot::after { content: ""; position: absolute; left: 7px; top: 2px; width: 5px; height: 10px; border: solid var(--black); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: 0; }
.hist-box input:checked + .hist-dot { background: var(--yellow-deep); border-color: var(--yellow-deep); }
.hist-box input:checked + .hist-dot::after { opacity: 1; }
.hist-box input:focus-visible + .hist-dot { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }
/* Edit mode's bottom bar: Select all, Copy selected, Delete selected, each a 44px button. */
.hist-foot { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); padding: var(--space-3) 0 max(var(--space-3), env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.hist-foot[hidden] { display: none; }
.hist-foot button { min-width: 0; min-height: 48px; padding: 0 var(--space-2); border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text); font: inherit; font-size: var(--fs-15); font-weight: var(--fw-semibold); line-height: var(--lh-sm); cursor: pointer; }
.hist-foot button:hover:not(:disabled) { border-color: var(--yellow-deep); }
.hist-foot button:disabled { color: var(--text-light); cursor: default; }
.why { margin-top: var(--space-4); font-size: var(--fs-13); color: var(--text-light); }
.why summary { display: inline-block; cursor: pointer; padding-block: var(--tap-pad); margin-block: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; list-style: none; }
.why summary::-webkit-details-marker { display: none; }
.why summary::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 0 var(--space-1) var(--space-2); border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); vertical-align: middle; }
.why[open] summary::after { transform: rotate(-135deg); margin-bottom: 0; }
.why.steps ol { margin: var(--space-2) 0 0; padding: 0; list-style: none; counter-reset: step; }
.why.steps li { counter-increment: step; margin: 0 0 var(--space-1); }
.why.steps li::before { content: counter(step) "."; display: inline-block; width: 22px; color: var(--text-light); font-variant-numeric: tabular-nums; }
.card .why p { font-size: var(--fs-17); line-height: var(--lh-md); color: var(--text-mid); margin-top: var(--space-3); }
.why a { display: inline-block; padding-block: var(--tap-pad); margin-top: calc(var(--space-2) - var(--tap-pad)); margin-bottom: calc(var(--tap-pad) * -1); color: var(--text-mid); text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
/* The card sets every paragraph to the 22px answer size. These lines sit under the answer, so they set their own. */
.card .sources { font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); }
.card .ai-note { font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-light); }
/* Sources disagree: both answers, each with its model name quiet under it. The card sets its own sizes, so it reads the same inside .card and on the landing demo. */
.card .disagree-title, .disagree-title { font-size: var(--fs-17); line-height: var(--lh-md); color: var(--text-mid); margin: 0; }
.card .disagree-alt, .disagree-alt { margin-top: var(--space-4); }
.card .disagree-answer, .disagree-answer { font-size: var(--fs-22); line-height: var(--lh-lg); color: var(--text); margin: 0; }
.card .disagree-model, .disagree-model { font-size: var(--fs-13); line-height: var(--lh-md); color: var(--text-mid); margin: var(--space-1) 0 0; }
.card .thinking p { font-size: var(--fs-17); color: var(--text-mid); }
/* Consent: the question is the headline, the explanation reads as body copy. */

.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; margin-top: var(--space-5); }
.chips[hidden] { display: none; }
.chips button {
  min-height: 48px; border: 1px solid var(--line); background: none; color: var(--text-mid); border-radius: 999px;
  padding: var(--space-2) var(--space-3); font: inherit; font-size: var(--fs-15); cursor: pointer;
}
.chips button:hover { color: var(--text); border-color: var(--yellow-deep); }
.recent { margin-top: var(--space-5); }
.recent[hidden] { display: none; }
.recent-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: var(--space-2); }
.recent-head .mockup-label { margin-bottom: 0; }
.recent-head button { border: 0; background: none; font: inherit; font-size: var(--fs-13); color: var(--text-mid); cursor: pointer; min-width: 44px; padding: var(--tap-pad) 0; margin-block: calc(var(--tap-pad) * -1); }
.recent-head button:hover { color: var(--text); }
.recent-list { list-style: none; }
.recent-list button {
  display: block; width: 100%; min-height: 44px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
  font: inherit; font-size: var(--fs-17); color: var(--text-mid); padding: var(--space-3) 0; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent-list button:hover { color: var(--text); }
.hint { text-align: left; font-size: var(--fs-13); color: var(--text-mid); margin-top: var(--space-6); }
.flit { display: block; width: 96px; height: 96px; margin: var(--space-5) auto 0; opacity: 0.9; }
.flit[hidden] { display: none; }
/* While an answer is on its way, Flit hums in the card: wing beat plus a bob. Stops the moment
   the answer replaces her. Off under reduced motion. */
.thinking { display: flex; align-items: center; gap: var(--space-4); }
.thinking svg, .thinking img { flex: none; width: 72px; height: 72px; overflow: visible; animation: flit-bob 1.2s ease-in-out infinite alternate; }
.thinking .flit-wing { transform-box: fill-box; transform-origin: 90% 10%; animation: flit-flap 0.22s ease-in-out infinite alternate; }
.thinking .flit-eye { transform-box: fill-box; transform-origin: center; animation: flit-blink 4s ease-in-out infinite; }
@keyframes flit-bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@keyframes flit-flap { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
@keyframes flit-blink { 0%, 100% { transform: scaleY(1); } 2% { transform: scaleY(0.1); } 4% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .thinking svg, .thinking img, .thinking .flit-wing, .thinking .flit-eye { animation: none; } }
</style>
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="/"><img src="icon-512.png" alt="">Nimble</a>
  <button type="button" class="menu-btn" id="menu-btn" aria-controls="nav" aria-expanded="false" aria-label="Menu" data-i18n-aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
  <nav id="nav" aria-label="Nimble"><button type="button" id="private"></button><button type="button" id="mascot"></button><button type="button" id="shape"></button><button type="button" id="pack-get" data-i18n="Download offline answers">Download offline answers</button><button type="button" id="pack-drop" hidden data-i18n="Remove offline pack">Remove offline pack</button><a href="/#install" data-i18n="Get the app">Get the app</a><a href="https://github.com/nulljosh/nimble" data-i18n="Source">Source</a></nav>
</header>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<main>
<div id="ask">
  <h1 class="sr-only" data-i18n="Ask anything.">Ask anything.</h1>
  <form id="f" autocomplete="off">
    <label class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="color:var(--yellow-deep)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="text" enterkeyhint="go" aria-label="Ask Nimble" data-i18n-aria-label="Ask Nimble" placeholder="define nimble" autofocus spellcheck="false">
      <button class="go" type="submit" data-i18n="Ask">Ask</button>
    </label>
  </form>
  <div class="tools">
    <button type="button" id="hist-open" aria-haspopup="dialog" data-i18n="History">History</button>
    <button type="button" id="new" data-i18n="New question" hidden>New question</button>
  </div>
  <section class="card" id="r" aria-live="polite" hidden></section>
  <img class="flit" id="flit" src="mascot/nim-wave.svg" width="96" height="96" alt="Nim, Nimble's mascot, waving">
  <div class="chips" id="chips"></div>
  <section class="recent" id="recent" aria-label="Recent searches" data-i18n-aria-label="Recent searches" hidden>
    <div class="recent-head"><div class="mockup-label" data-i18n="Recent">Recent</div><button type="button" id="clear" data-i18n="Clear">Clear</button></div>
    <ul class="recent-list" id="recent-list"></ul>
  </section>
  <p class="hint" data-i18n="Math, units and graphs work offline. Everything else gets one sentence and a source.">Math, units and graphs work offline. Everything else gets one sentence and a source.</p>
</div>
  <img id="shareDebug" alt="" style="display:block;width:100%;margin-top:var(--space-5)">
</main>
<dialog class="hist" id="hist" aria-labelledby="hist-title">
  <div class="hist-inner">
    <div class="hist-head">
      <button type="button" id="hist-back" data-i18n="Back">Back</button>
      <h2 class="hist-title" id="hist-title" data-i18n="History">History</h2>
      <button type="button" id="hist-edit" data-i18n="Edit">Edit</button>
    </div>
    <div class="hist-body">
      <p class="hist-empty" id="hist-empty" data-i18n="No questions yet." hidden>No questions yet.</p>
      <ul class="hist-list" id="hist-list"></ul>
    </div>
    <div class="hist-foot" id="hist-bar" hidden>
      <button type="button" id="hist-all" data-i18n="Select all">Select all</button>
      <button type="button" id="hist-copy" data-i18n="Copy selected">Copy selected</button>
      <button type="button" id="hist-delete" data-i18n="Delete selected">Delete selected</button>
    </div>
  </div>
</dialog>
<script src="i18n.js"></script>
<script src="engine.js?v=offline"></script>
<script>
document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bulb').trim();
// The two mascots. Nim is the default (docs/mascot/nim-*.svg, drawn by scripts/nim-poses.py); Fen is the
// fennec from docs/mascot/fen.svg, inlined so the empty state and the loading card work offline too.
var FEN='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true" focusable="false"><path style="fill:var(--bulb-deep)" d="M60 196 C 30 190, 26 160, 48 152 C 44 172, 60 180, 82 178 Z" /><circle style="fill:var(--flit-belly)" cx="48" cy="156" r="10" /><ellipse style="fill:var(--bulb)" cx="120" cy="178" rx="48" ry="36" /><ellipse style="fill:var(--flit-belly)" cx="120" cy="190" rx="28" ry="18" /><path style="fill:var(--bulb)" d="M74 118 C 50 60, 62 30, 84 36 C 98 44, 104 90, 100 122 Z" /><path style="fill:var(--flit-cheek)" d="M80 112 C 66 70, 72 48, 84 48 C 92 56, 96 92, 94 118 Z"  opacity="0.45"/><path style="fill:var(--bulb)" d="M166 118 C 190 60, 178 30, 156 36 C 142 44, 136 90, 140 122 Z" /><path style="fill:var(--flit-cheek)" d="M160 112 C 174 70, 168 48, 156 48 C 148 56, 144 92, 146 118 Z"  opacity="0.45"/><circle style="fill:var(--bulb)" cx="120" cy="120" r="50" /><ellipse style="fill:var(--flit-belly)" cx="120" cy="140" rx="24" ry="16" /><circle style="fill:var(--flit-cheek)" cx="86" cy="134" r="8"  opacity="0.35"/><circle style="fill:var(--flit-cheek)" cx="154" cy="134" r="8"  opacity="0.35"/><circle style="fill:var(--black)" cx="100" cy="112" r="14" /><circle style="fill:var(--flit-glint)" cx="105" cy="106" r="5" /><circle style="fill:var(--black)" cx="140" cy="112" r="14" /><circle style="fill:var(--flit-glint)" cx="145" cy="106" r="5" /><path style="fill:var(--black);stroke:var(--black)" d="M112 136 L128 136 L120 146 Z"   stroke-width="3" stroke-linejoin="round"/></svg>';
// The empty-state image: a data URI for Fen (no network, works offline), Nim waving for everyone else.
function paintMascotImg(){
  var fen=mascot()==='fen', el=document.getElementById('flit');
  el.src=fen?'data:image/svg+xml,'+encodeURIComponent(FEN):'mascot/nim-wave.svg';
  el.alt=fen?"Fen, Nimble's fennec":"Nim, Nimble's mascot, waving";
}
paintMascotImg();
// Everything below speaks the visitor's language, so it starts once the locale has loaded.
I18N.ready.then(function(){
var T=I18N.t;
  var f=document.getElementById('f'), q=document.getElementById('q'), r=document.getElementById('r'), chips=document.getElementById('chips');
  var last=null, shot=location.search.indexOf('share=1')>-1; // last: the answer on screen, for Share. shot: screenshots only
  var hist=searchHistory, recent=document.getElementById('recent'), recentList=document.getElementById('recent-list'), flit=document.getElementById('flit');
  var newBtn=document.getElementById('new');
  // Flit is part of the empty state only: no answer on screen and no recent searches, so the TRY chips are up.
  function paintFlit(){ flit.hidden=!r.hidden||!recent.hidden; }
  // Recent searches replace the suggestion chips once there is any history. textContent only, never HTML.
  function paintRecent(){
    var items=hist.list().slice(0,8);
    recent.hidden=!items.length; chips.hidden=items.length>0; paintFlit();
    recentList.textContent='';
    items.forEach(function(e){
      var li=document.createElement('li'), b=document.createElement('button');
      b.type='button'; b.textContent=e.q; b.title=e.q; b.onclick=function(){ run(e.q); };
      li.appendChild(b); recentList.appendChild(li);
    });
  }
  document.getElementById('clear').addEventListener('click',function(){ hist.clear(); paintRecent(); });
  async function run(query, opts){
    query=(query||q.value||q.placeholder).trim(); if(!query) return;
    q.value=query; r.hidden=false; paintFlit();
    newBtn.hidden=true;
    r.innerHTML='<div class="mockup-label">'+T('Answer')+'</div><div class="thinking">'+(mascot()==='fen'?FEN:'<img src="mascot/nim-think.svg" width="72" height="72" alt="">')+'<p>'+T('Thinking…')+'</p></div>';
    // Shareable: /app?q=... opens straight onto the answer.
    history.replaceState(null,'','?q='+encodeURIComponent(query));
    await packReady;
    var res=await renderAnswer(query,{t:T, pack:OFFLINE_PACK, privateMode:privateOn()});
    if(q.value.trim()!==query) return;  // a newer question already went out
    r.classList.remove('swap'); void r.offsetWidth; r.classList.add('swap');
    last={q:query, a:res.a};
    var share=shareText(res.a)?'<button type="button" data-share>'+T('Share')+'</button>':'';
    // Listen: the browser's own voice reads the answer aloud; nothing is sent anywhere.
    if(share&&'speechSynthesis' in window) share='<button type="button" data-listen>'+T('Listen')+'</button>'+share;
    // Copy sits next to the answer, first, as on the iPhone.
    if(share) share='<button type="button" data-copy>'+T('Copy')+'</button>'+share;
    // Tell me more: a text answer can grow to three sentences, once, on a tap. Not offline or in Private mode.
    // Not for a site's own page: the AI that tells more does not know the site.
    if(res.kind==='text' && !privateOn() && !/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(res.a.src||'')) share+='<button type="button" data-more>'+T('Tell me more')+'</button>';
    r.innerHTML=res.h+(res.credit||share?'<div class="credit">'+(res.credit?'<span>'+res.credit+'</span>':'')+share+'</div>':'');
    // Voice loop: a question asked out loud gets its answer read back, through the same Listen button.
    if(opts&&opts.spoken){ var lb=r.querySelector('[data-listen]'); if(lb) lb.click(); }
    newBtn.hidden=false;
    if(shot) shareImage(query,res.a).then(function(b){ if(b) document.getElementById('shareDebug').src=URL.createObjectURL(b); }); // screenshots only
    // The saved answer is the first 280 characters of the answer's text, on this device only.
    if(['none','offline','pack-miss','private-nopack'].indexOf(res.kind)<0){ var snip=shareText(res.a); hist.add(query, typeof snip==='string'?snip:null); paintRecent(); }
  }
  // Share sheet with the PNG where the browser can, a download of nimble-answer.png where it can't.
  async function shareAnswer(){
    if(!last) return;
    try{
      var blob=await shareImage(last.q,last.a,cardShape()); if(!blob) return;
      var file=new File([blob],'nimble-answer.png',{type:'image/png'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file]}); return; }
        catch(err){ if(err && err.name==='AbortError') return; }
      }
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download='nimble-answer.png'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    }catch(err){}
  }
  f.addEventListener('submit',function(e){ e.preventDefault(); run(); });
  // Voice, only where the browser can listen. Words stream into the field; when it stops, the question runs.
  // Every failure, a denied mic included, just puts the button back to idle.
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    var mic=document.createElement('button'), rec=null, usual=null;
    mic.type='button'; mic.className='mic';
    mic.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>';
    f.querySelector('.go').before(mic);
    var paintMic=function(state){
      var l=listenLabel(state);
      mic.classList.toggle('on',state==='listening');
      mic.setAttribute('aria-pressed',state==='listening'?'true':'false');
      mic.setAttribute('aria-label',T(l.button)); mic.title=T(l.button);
      if(l.placeholder){ if(usual===null) usual=q.placeholder; q.placeholder=T(l.placeholder); }
      else if(usual!==null){ q.placeholder=usual; usual=null; }
    };
    paintMic('idle');
    mic.addEventListener('click',function(){
      if(rec){ try{ rec.stop(); }catch(err){} return; }
      var heard='';
      try{
        var s=new SR();
        s.lang=navigator.language||'en-US'; s.interimResults=true; s.continuous=false; s.maxAlternatives=1;
        s.onresult=function(e){
          var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
          heard=t.trim(); q.value=heard;
        };
        s.onerror=function(e){ if(e && e.error!=='no-speech' && e.error!=='network') heard=''; };
        s.onend=function(){ rec=null; paintMic('idle'); if(heard) run(heard,{spoken:true}); };
        rec=s; s.start(); paintMic('listening');
      }catch(err){ rec=null; paintMic('idle'); }
    });
  }
  // No AI switch any more: Private mode is the one off switch. Anyone who had turned AI off lands in Private,
  // so nothing they kept local starts leaving the page.
  if(aiConsent()==='no'){ try{ localStorage.setItem('nimble.private','1'); }catch(err){} aiConsent(''); }
  // Private mode: answers come from math, units, graphs and the offline pack only; no request leaves the page.
  var privBtn=document.getElementById('private');
  function privateOn(){ try{ return localStorage.getItem('nimble.private')==='1'; }catch(err){ return false; } }
  function paintPrivate(){
    privBtn.textContent=T(privateOn()?'Private: on':'Private: off');
    privBtn.title=T(privateOn()?'Nothing leaves this device. Click to turn private mode off':'Click to answer only from this device');
  }
  paintPrivate();
  privBtn.addEventListener('click',function(){ try{ privateOn()?localStorage.removeItem('nimble.private'):localStorage.setItem('nimble.private','1'); }catch(err){} paintPrivate(); });
  // Mascot switch: Nim or Fen. Repaints the empty state at once; the next loading card picks it up too.
  var mascotBtn=document.getElementById('mascot');
  function paintMascot(){
    mascotBtn.textContent=T('Mascot: {s}',{s:mascot()==='fen'?'Fen':'Nim'});
    paintMascotImg();
  }
  paintMascot();
  mascotBtn.addEventListener('click',function(){ mascot(mascot()==='fen'?'nim':'fen'); paintMascot(); });
  // Share card shape: wide, square or story, a click cycles it.
  var shapeBtn=document.getElementById('shape'), SHAPES=['wide','square','story'];
  function paintShape(){ shapeBtn.textContent=T('Card: {s}',{s:T(cardShape()==='wide'?'Wide':cardShape()==='square'?'Square':'Story')}); }
  paintShape();
  shapeBtn.addEventListener('click',function(){ cardShape(SHAPES[(SHAPES.indexOf(cardShape())+1)%3]); paintShape(); });
  // Listen, Copy and Share live inside the result card.
  r.addEventListener('click',function(e){
    var lb=e.target.closest('[data-listen]');
    if(lb){
      var ss=window.speechSynthesis;
      if(ss.speaking){ ss.cancel(); lb.textContent=T('Listen'); return; }
      var say=last&&shareText(last.a); if(!say) return;
      var u=new SpeechSynthesisUtterance(say); u.lang=document.documentElement.lang||'en';
      u.onend=u.onerror=function(){ lb.textContent=T('Listen'); };
      lb.textContent=T('Stop'); ss.speak(u); return;
    }
    var cb=e.target.closest('[data-copy]');
    if(cb){
      var text=last&&shareText(last.a); if(!text) return;
      try{ navigator.clipboard.writeText(text).then(function(){ cb.textContent=T('Copied'); setTimeout(function(){ cb.textContent=T('Copy'); },1500); },function(){}); }catch(err){}
      return;
    }
    if(e.target.closest('[data-share]')){ shareAnswer(); return; }
    var mb=e.target.closest('[data-more]');
    if(mb){
      if(!last||mb.disabled) return;
      var asked=last; mb.disabled=true; mb.textContent=T('Thinking…');
      tellMore(asked.q).then(function(m){
        if(last!==asked) return;  // a newer question replaced this card
        var p=r.querySelector('.mockup-link p');
        if(!m||!p){ mb.textContent=T('Nothing more to add'); return; }
        p.textContent=m.body; asked.a=Object.assign({},asked.a,{body:m.body}); mb.remove();
      },function(){ mb.disabled=false; mb.textContent=T('Tell me more'); });
      return;
    }
  });
  fetch('suggestions.json').then(function(x){return x.json();}).then(function(list){
    list.sort(function(){return Math.random()-0.5;}).slice(0,6).forEach(function(s){
      var b=document.createElement('button'); b.type='button'; b.textContent=s;
      b.onclick=function(){ run(s); }; chips.appendChild(b);
    });
    q.placeholder=list[6]||q.placeholder;
    // No heading: the placeholder cycles through example questions until something is typed.
    var cur=q.placeholder, n=7;
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(function(){
      if(q.value||document.hidden||q.placeholder!==cur) return;
      cur=q.placeholder=list[n++%list.length];
    },3500);
  }).catch(function(){});
  if(location.search.indexOf('seed=1')>-1) ['5 miles to km','capital of Canada','sqrt(144)'].forEach(function(s){ hist.add(s); }); // screenshots only
  paintRecent();
  // New question: clears the field and the answer, and puts the cursor back in the field.
  newBtn.addEventListener('click',function(){
    last=null; q.value=''; r.innerHTML=''; r.hidden=true; newBtn.hidden=true; paintFlit();
    history.replaceState(null,'',location.pathname); q.focus();
  });
  // Offline pack: an explicit download, kept in IndexedDB (never localStorage). Nothing fetches it on its own.
  // Every step is wrapped: if storage or the download fails, the page simply answers as it did before.
  var PACK_URL='pack/wikipedia-top-v1.json.gz', PACK_INDEX='pack/index.json', PACK_KEY='wikipedia-top-v1';
  var OFFLINE_PACK=null, packGetBtn=document.getElementById('pack-get'), packDropBtn=document.getElementById('pack-drop'), packBytes=0, packBusy=false;
  function packIO(mode, fn){
    return new Promise(function(resolve,reject){
      var rq=indexedDB.open('nimble-offline',1);
      rq.onupgradeneeded=function(){ rq.result.createObjectStore('packs'); };
      rq.onerror=function(){ reject(rq.error); };
      rq.onsuccess=function(){
        var db=rq.result, tx=db.transaction('packs',mode), req=fn(tx.objectStore('packs'));
        tx.oncomplete=function(){ db.close(); resolve(req.result); };
        tx.onerror=function(){ db.close(); reject(tx.error); };
      };
    });
  }
  var packReady=packIO('readonly',function(st){ return st.get(PACK_KEY); }).then(function(p){ OFFLINE_PACK=p||null; }).catch(function(){ OFFLINE_PACK=null; });
  function packPaint(){
    packDropBtn.hidden=!OFFLINE_PACK; packGetBtn.hidden=!!OFFLINE_PACK;
    packGetBtn.disabled=packBusy;
    if(packBusy){ packGetBtn.textContent=T('Downloading offline answers…'); return; }
    packGetBtn.textContent=packBytes ? T('Download offline answers (about {n} MB)',{n:(packBytes/1048576).toFixed(1)}) : T('Download offline answers');
  }
  async function packSizeLabel(){ try{ var r=await fetch(PACK_INDEX); if(r.ok){ var j=await r.json(); packBytes=j.bytes||0; } }catch(err){} packPaint(); }
  async function packDownload(){
    if(packBusy) return;
    packBusy=true; packPaint();
    try{
      var r=await fetch(PACK_URL); if(!r.ok) throw new Error('pack '+r.status);
      var text=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
      var obj=JSON.parse(text); if(!obj||!Array.isArray(obj.entries)) throw new Error('bad pack');
      await packIO('readwrite',function(st){ return st.put(obj,PACK_KEY); });
      OFFLINE_PACK=obj;
    }catch(err){ alert(T('Could not download the offline pack. Try again on a connection.')); }
    packBusy=false; packPaint();
  }
  packGetBtn.addEventListener('click',packDownload);
  packDropBtn.addEventListener('click',async function(){
    try{ await packIO('readwrite',function(st){ return st.delete(PACK_KEY); }); }catch(err){}
    OFFLINE_PACK=null; packPaint();
  });
  // Size label: a small index file, read when the menu is painted (explicit page open, never a download).
  packReady.then(function(){ packPaint(); if(!OFFLINE_PACK) packSizeLabel(); });
  // Phone menu: the links sit in a sheet behind one 44px button. Esc or a tap outside closes it and returns focus to the button.
  var top=document.getElementById('top'), menuBtn=document.getElementById('menu-btn');
  function setMenu(on){ top.classList.toggle('open',on); menuBtn.setAttribute('aria-expanded',on?'true':'false'); }
  menuBtn.addEventListener('click',function(){ setMenu(!top.classList.contains('open')); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && top.classList.contains('open')){ setMenu(false); menuBtn.focus(); } });
  document.addEventListener('click',function(e){ if(top.classList.contains('open') && !top.contains(e.target)) setMenu(false); });
  document.getElementById('scrim').addEventListener('click',function(){ setMenu(false); menuBtn.focus(); });
  // History: every question with its saved answer, in a modal dialog (the browser traps focus and Esc closes it).
  // A row asks it again; Edit adds a circle per row and the bottom bar: Select all, Copy selected, Delete selected.
  var histDlg=document.getElementById('hist'), histOpen=document.getElementById('hist-open'), histList=document.getElementById('hist-list'),
      histEmpty=document.getElementById('hist-empty'), histBar=document.getElementById('hist-bar'), histEdit=document.getElementById('hist-edit'),
      histAll=document.getElementById('hist-all'), histCopy=document.getElementById('hist-copy'), histDelete=document.getElementById('hist-delete');
  var histEditing=false, histPicked=new Set(), histRestore=true;
  var locale=document.documentElement.lang||'en';
  var rtf=null; try{ rtf=new Intl.RelativeTimeFormat(locale,{numeric:'auto'}); }catch(err){}
  // Relative time for a saved row: "2 minutes ago", "yesterday", else a short date.
  function whenText(t){
    if(!t) return '';
    var s=Math.round((t-Date.now())/1000), a=Math.abs(s);
    try{
      if(a<60) return rtf.format(0,'second');
      if(a<3600) return rtf.format(Math.round(s/60),'minute');
      if(a<86400) return rtf.format(Math.round(s/3600),'hour');
      if(a<604800) return rtf.format(Math.round(s/86400),'day');
      return new Date(t).toLocaleDateString(locale,{month:'short',day:'numeric'});
    }catch(err){ return ''; }
  }
  function showHistory(on){
    if(on){ histEditing=false; histPicked.clear(); paintHistory(); histDlg.showModal(); histDlg.scrollTop=0; document.getElementById('hist-back').focus(); }
    else if(histDlg.open) histDlg.close();
  }
  // Closing hands focus back to the History button; a row that asks again sends it to the field's answer instead.
  histDlg.addEventListener('close',function(){ if(histRestore) histOpen.focus(); histRestore=true; });
  // A row's text: the question, the saved answer snippet, then the time. textContent only.
  function histRowText(e){
    var wrap=document.createElement('span'); wrap.className='hist-text';
    var qq=document.createElement('span'); qq.className='hist-q'; qq.textContent=e.q; wrap.appendChild(qq);
    if(e.a){ var sn=document.createElement('span'); sn.className='hist-snip'; sn.textContent=e.a; wrap.appendChild(sn); }
    var w=whenText(e.t); if(w){ var wh=document.createElement('span'); wh.className='hist-when'; wh.textContent=w; wrap.appendChild(wh); }
    return wrap;
  }
  function paintHistoryBar(){ histCopy.disabled=histDelete.disabled=!histPicked.size; }
  function paintHistory(){
    var items=hist.list();
    histEmpty.hidden=items.length>0; histEdit.hidden=!items.length;
    histEdit.textContent=T(histEditing?'Done':'Edit');
    histBar.hidden=!(histEditing && items.length);
    histAll.disabled=!items.length;
    paintHistoryBar();
    histList.textContent='';
    items.forEach(function(e){
      var li=document.createElement('li'); li.className='hist-row';
      if(histEditing){
        var lab=document.createElement('label'); lab.className='hist-pick';
        var box=document.createElement('span'); box.className='hist-box';
        var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=histPicked.has(e.q);
        var dot=document.createElement('span'); dot.className='hist-dot'; dot.setAttribute('aria-hidden','true');
        cb.addEventListener('change',function(){ if(cb.checked) histPicked.add(e.q); else histPicked.delete(e.q); paintHistoryBar(); });
        box.appendChild(cb); box.appendChild(dot); lab.appendChild(box); lab.appendChild(histRowText(e)); li.appendChild(lab);
      } else {
        var ask=document.createElement('button'); ask.type='button'; ask.className='hist-ask';
        ask.appendChild(histRowText(e));
        ask.setAttribute('aria-label', e.q+'. '+T('Ask again'));
        ask.onclick=function(){ histRestore=false; showHistory(false); run(e.q); };
        var del=document.createElement('button'); del.type='button'; del.className='hist-del';
        del.textContent=T('Delete'); del.setAttribute('aria-label', T('Delete')+': '+e.q);
        del.onclick=function(){ hist.remove(e.q); histPicked.delete(e.q); paintHistory(); paintRecent(); };
        li.appendChild(ask); li.appendChild(del);
      }
      histList.appendChild(li);
    });
  }
  histOpen.addEventListener('click',function(){ showHistory(true); });
  document.getElementById('hist-back').addEventListener('click',function(){ showHistory(false); });
  histEdit.addEventListener('click',function(){ histEditing=!histEditing; histPicked.clear(); paintHistory(); });
  histAll.addEventListener('click',function(){ hist.list().forEach(function(e){ histPicked.add(e.q); }); paintHistory(); });
  histDelete.addEventListener('click',function(){ hist.remove(Array.from(histPicked)); histPicked.clear(); paintHistory(); paintRecent(); });
  histCopy.addEventListener('click',function(){
    var text=hist.list().filter(function(e){ return histPicked.has(e.q); }).map(function(e){ return e.q+(e.a?'\n'+e.a:''); }).join('\n\n');
    if(!text) return;
    var flash=function(){ histCopy.textContent=T('Copied'); setTimeout(function(){ histCopy.textContent=T('Copy selected'); },1500); };
    try{ navigator.clipboard.writeText(text).then(flash,function(){}); }catch(err){}
  });
  // ?q= from links and the share sheet (manifest share_target sends text as q, a link as url); capped like the apps.
  var sp=new URLSearchParams(location.search), start=((sp.get('q')||sp.get('url')||'').trim()).slice(0,300); if(start) run(start);
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
