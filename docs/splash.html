<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimble</title>
<meta name="theme-color" content="#ffca30">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--yellow);
    font-family: var(--font);
  }
  .mark { text-align: center; }
  .mark svg { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
  .mark h1 { margin-top: 16px; font-size: 1.4rem; font-weight: var(--fw-bold); color: var(--black); letter-spacing: var(--tracking-tight); }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.7; } }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimble">
      <rect width="200" height="200" rx="44" fill="#000"/>
      <circle cx="100" cy="80" r="44" fill="#ffca30"/>
      <rect x="85" y="110" width="30" height="26" fill="#ffca30"/>
      <rect x="80" y="130" width="40" height="32" rx="8" fill="#ffca30"/>
      <rect x="80" y="140" width="40" height="5" fill="#000"/>
      <rect x="80" y="150" width="40" height="5" fill="#000"/>
    </svg>
    <h1>Nimble</h1>
  </div>
</body>
</html>
