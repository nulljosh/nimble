<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimble</title>
<meta name="theme-color" content="#ffca30">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #ffca30;
    font-family: "Avenir Next", "Avenir", "Helvetica Neue", Arial, sans-serif;
  }
  .mark { text-align: center; }
  .mark svg { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
  .mark h1 { margin-top: 16px; font-size: 1.4rem; font-weight: 700; color: #000; letter-spacing: -0.02em; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.7; } }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" rx="40" fill="#1a1a2e"/>
      <circle cx="85" cy="85" r="32" fill="none" stroke="#ff8c12" stroke-width="5" stroke-linecap="round"/>
      <line x1="108" y1="108" x2="140" y2="140" stroke="#ff8c12" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>Nimble</h1>
  </div>
</body>
</html>
