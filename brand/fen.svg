<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Fen, the fennec fox">
  <!-- Fennec: huge ears, tiny round body, same three brand tones. Front three-quarter view, sitting. -->
  <!-- tail curled around -->
  <path d="M60 196 C 30 190, 26 160, 48 152 C 44 172, 60 180, 82 178 Z" fill="#8a6412"/>
  <circle cx="48" cy="156" r="10" fill="#ffe27a"/>
  <!-- body -->
  <ellipse cx="120" cy="178" rx="48" ry="36" fill="#ffca30"/>
  <ellipse cx="120" cy="190" rx="28" ry="18" fill="#ffe27a"/>
  <!-- ears: the whole point -->
  <path d="M74 118 C 50 60, 62 30, 84 36 C 98 44, 104 90, 100 122 Z" fill="#ffca30"/>
  <path d="M80 112 C 66 70, 72 48, 84 48 C 92 56, 96 92, 94 118 Z" fill="#e07a3f" opacity="0.45"/>
  <path d="M166 118 C 190 60, 178 30, 156 36 C 142 44, 136 90, 140 122 Z" fill="#ffca30"/>
  <path d="M160 112 C 174 70, 168 48, 156 48 C 148 56, 144 92, 146 118 Z" fill="#e07a3f" opacity="0.45"/>
  <!-- head -->
  <circle cx="120" cy="120" r="50" fill="#ffca30"/>
  <!-- muzzle -->
  <ellipse cx="120" cy="140" rx="24" ry="16" fill="#ffe27a"/>
  <!-- cheeks -->
  <circle cx="86" cy="134" r="8" fill="#e07a3f" opacity="0.35"/>
  <circle cx="154" cy="134" r="8" fill="#e07a3f" opacity="0.35"/>
  <!-- eyes: huge -->
  <circle cx="100" cy="112" r="14" fill="#1f1b16"/>
  <circle cx="105" cy="106" r="5" fill="#fff8e1"/>
  <circle cx="140" cy="112" r="14" fill="#1f1b16"/>
  <circle cx="145" cy="106" r="5" fill="#fff8e1"/>
  <!-- nose -->
  <path d="M112 136 L128 136 L120 146 Z" fill="#1f1b16" stroke="#1f1b16" stroke-width="3" stroke-linejoin="round"/>
</svg>
