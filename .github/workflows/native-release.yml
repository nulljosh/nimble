# Builds the real Windows/Linux/Android binaries from kmp/. The .msi, .deb, .rpm and .flatpak can only be
# produced on their own OS, which is why this runs on GitHub and not the Mac.
name: native release
on:
  workflow_dispatch:
  push:
    tags: ["native-v*"]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, task: packageMsi, glob: "**/*.msi" }
          - { os: ubuntu-latest,  task: packageDeb, glob: "**/*.deb" }
          - { os: ubuntu-latest,  task: packageRpm, glob: "**/*.rpm" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # jpackage builds an .rpm with rpmbuild, which ubuntu-latest does not ship.
      - if: matrix.task == 'packageRpm'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - run: ./gradlew :composeApp:${{ matrix.task }} --no-daemon
        working-directory: kmp
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}
          path: kmp/composeApp/build/compose/binaries/**/${{ matrix.glob }}
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew :composeApp:createDistributable --no-daemon
        working-directory: kmp
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean build kmp/flatpak/com.nulljosh.Nimble.yml
          flatpak build-bundle repo Nimble.flatpak com.nulljosh.Nimble
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Nimble.flatpak
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # ubuntu-latest ships the Android SDK at ANDROID_HOME; setup-android@v3
      # tries to install the retired 'tools' package and fails the job.
      # ponytail: debug APK, sideloadable today. assembleRelease once a keystore is in secrets.
      - run: ./gradlew :composeApp:assembleDebug --no-daemon
        working-directory: kmp
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: kmp/composeApp/build/outputs/apk/debug/*.apk
