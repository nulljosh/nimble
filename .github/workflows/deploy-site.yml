# nimble.heyitsmejosh.com was deployed by hand -- `build-site.sh && wrangler pages
# deploy dist` from a laptop -- so it silently fell weeks behind docs/. GitHub Pages
# auto-deploys docs/ and the custom domain did not, which is why the two disagreed.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if`, so surface
    # the token as env first and test that instead.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Composes dist/: landing page at /, search app at /app.
      - run: scripts/build-site.sh

      - name: Verify the hero animation made it into dist/
        run: |
          grep -q '@keyframes drift' dist/index.html
          test -f dist/app/index.html

      # Fail loudly. This used to `if: env.CF_API_TOKEN != ''` so a missing
      # secret left main green -- which meant every run reported success while
      # deploying nothing, and the site fell weeks behind exactly as the header
      # above describes. A green check has to mean the site actually shipped.
      - name: Require the deploy credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set; nothing would deploy"; exit 1; }

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nimble --branch=main
