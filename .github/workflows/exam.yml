# Weekly question exam against the live engine (Sundays). Nightly runs ate the free Workers AI quota (10k neurons/day) before real users woke up. A miss opens (or comments on) one issue.
name: Exam
on:
  schedule: [{cron: '17 9 * * 0'}]
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node test/exam.js | tee exam.txt
      - run: CAP=200 node test/exam-1000.js | tee -a exam.txt
      # The 154-question score goes to /stats, pass or fail.
      - if: always()
        env: {KEY: '${{ secrets.NIMBLE_REPORTS_KEY }}'}
        run: |
          read score total < <(grep -oE '^[0-9]+/[0-9]+ pass' exam.txt | head -1 | tr '/' ' ' | cut -d' ' -f1,2)
          [ -n "$KEY" ] && [ -n "$score" ] && curl -sf -X POST "https://nimble-answers.trommatic.workers.dev/exam?key=$KEY" -d "{\"score\":$score,\"total\":$total}" || true
      - if: failure()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          body="$(tail -3 exam.txt)"
          n=$(gh issue list --label exam --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --label exam --title "Nightly exam has misses" --body "$body" || gh issue create --title "Nightly exam has misses" --body "$body"; fi
