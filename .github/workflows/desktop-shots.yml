name: Desktop screenshots

# Run by hand: Actions > Desktop screenshots > Run workflow. Starts the Compose desktop app on a real
# Linux and a real Windows runner and uploads a screenshot of each, so the shared UI can be read by eye.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y xvfb scrot xdotool
      # A cold build takes longer than any fixed sleep, so build first, then wait for the window itself.
      - name: Build
        working-directory: kmp
        run: ./gradlew :composeApp:compileKotlinDesktop --console=plain
      - name: Run the app and capture it
        working-directory: kmp
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          ./gradlew :composeApp:run --console=plain > ../run.log 2>&1 &
          for i in $(seq 1 60); do xdotool search --name Nimble >/dev/null 2>&1 && break; sleep 3; done
          sleep 8
          scrot ../linux.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nimble-linux-log
          path: run.log
      - uses: actions/upload-artifact@v4
        with:
          name: nimble-linux-shot
          path: linux.png
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the app and capture it
        working-directory: kmp
        shell: pwsh
        run: |
          Start-Process -FilePath ./gradlew.bat -ArgumentList ':composeApp:run','--console=plain' -RedirectStandardOutput ../run.log -WindowStyle Hidden
          Start-Sleep -Seconds 240
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/../windows.png")
      - uses: actions/upload-artifact@v4
        with:
          name: nimble-windows-shot
          path: windows.png
          if-no-files-found: error
