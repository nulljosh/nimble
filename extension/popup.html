<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
  :root { --accent: #f08a00; --ring: color-mix(in srgb, #f08a00 30%, transparent); --bg: #fff; --fill: #f2f2f7; --text: #1d1d1f; --text2: rgba(29,29,31,.6); --s1: 8px; --s2: 16px; --s3: 24px; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fill: #1c1c1e; --text: #f5f5f7; --text2: rgba(245,245,247,.6); } }
  * { box-sizing: border-box; }
  body { width: 336px; margin: 0; padding: var(--s2); background: var(--bg); color: var(--text); font: 17px/24px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  input { display: block; width: 100%; height: 48px; padding: 0 var(--s2); border: 0; border-radius: 24px; background: var(--fill); color: var(--text); font: inherit; outline: 0; transition: box-shadow .2s ease; }
  input::placeholder { color: var(--text2); }
  input:focus { box-shadow: 0 0 0 4px var(--ring); }
  #a { margin: var(--s2) var(--s1) 0; font-weight: 600; min-height: 24px; }
  #s { margin: var(--s1) var(--s1) 0; font-size: 13px; line-height: 18px; color: var(--text2); }
  #s:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { input { transition: none; } }
</style>
<input id="q" placeholder="Ask anything" aria-label="Question" autofocus>
<p id="a" role="status"></p>
<p id="s"></p>
<script src="engine.js"></script>
<script src="popup.js"></script>
