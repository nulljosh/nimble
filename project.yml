name: Nimble
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    # Must live under `base:` — as a sibling of it xcodegen ignores it entirely,
    # and signing fails with "requires a development team".
    DEVELOPMENT_TEAM: QMM486NPYC
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "9.4.5"
    CURRENT_PROJECT_VERSION: "102"
targets:
  Nimble:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "iOS/**"
      - path: Resources
        buildPhase: resources
      # Icon Composer bundle; Xcode builds the legacy sizes from it
      - path: Nimble.icon
      # Nimble Sans, the app's own typeface (fonts/README.md)
      - path: fonts
        includes:
          - "*.ttf"
        buildPhase: resources
      # The bulb on the share card, read from the web's own copy so there is one file
      - path: docs/icon-512.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios
        GENERATE_INFOPLIST_FILE: YES
        # Required for notarization, which is what stops downloads landing in
        # "unidentified developer" jail. scripts/release-macos.sh does the rest.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Nimble-macOS.entitlements
        INFOPLIST_FILE: Nimble-macOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Nimble
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nimble turns what you say into a question. Nothing is kept."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nimble listens only while you hold the mic."
  Nimble-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Models
      - path: Sources/Views
        excludes:
          - "SearchView.swift"
          - "VisualEffectView.swift"
          - "ContextMenuView.swift"
          - "SettingsView.swift"
      - path: Sources/iOS
      # Flit for the empty state. The same catalog the Mac target compiles through Resources.
      - path: Resources/Assets.xcassets
      # The same String Catalog the Mac target picks up through Resources, generated from i18n/strings.json
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Nimble.icon
      - path: docs/icon-512.png
        buildPhase: resources
      # Nimble Sans, the app's own typeface (fonts/README.md). UIAppFonts lists them in the plist.
      - path: fonts
        includes:
          - "*.ttf"
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Nimble
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        # Mirrors the macOS target. Its absence is the real cause of ITMS-90242
        # on upload, which reads like a signing failure but is not.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nimble turns what you say into a question. Nothing is kept."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nimble listens only while you hold the mic."
        # UILaunchScreen is a dict, and no INFOPLIST_KEY_ can express one -- the
        # only launch-screen setting Xcode defines is _Generation, which just
        # synthesises an EMPTY dict. So the real key comes from this hand-written
        # base plist; GENERATE_INFOPLIST_FILE stays YES and Xcode merges the
        # INFOPLIST_KEY_* settings below on top of it. Full reasoning in the file.
        # Without any UILaunchScreen key at all iOS runs the app letterboxed in
        # 320x480 compatibility mode instead of at native resolution.
        INFOPLIST_FILE: Nimble-iOS-Info.plist
        # Universal: iPad was never excluded for a design reason, only never enabled.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        CODE_SIGN_ENTITLEMENTS: Nimble-iOS.entitlements
    dependencies:
      - target: NimbleWidget
      - target: NimbleShare
      # The watch app ships inside the iPhone app.
      - target: NimbleWatch
  # Home screen widget: the last answer, tap to ask. Reads the app group the app writes.
  NimbleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Sources/Models/SharedAnswer.swift
      # SharedAnswer reads NimbleStorage, which lives here (5.17.3 added it; the widget needs it too).
      - path: Sources/Models/QASandbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios.widget
        PRODUCT_NAME: NimbleWidget
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/NimbleWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  # Share sheet: "Ask Nimble" parks the shared text or link in the app group; the app asks it on open.
  NimbleShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Sources/Models/SharedAnswer.swift
      - path: Sources/Models/QASandbox.swift
      - path: Sources/Views/Tokens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios.share
        PRODUCT_NAME: NimbleShare
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/NimbleShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  # Apple Watch: ask by voice, read one sentence. The engine files below are the Foundation-only half of Sources/Models.
  NimbleWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Sources/Models/AIEngine.swift
      - path: Sources/Models/OfflinePack.swift
      - path: Sources/Models/Preferences.swift
      - path: Sources/Models/QASandbox.swift
      - path: Sources/Models/SharedAnswer.swift
      - path: Sources/Models/OnDeviceAnswers.swift
      - path: Sources/Models/QueryEngine.swift
      - path: Sources/Models/QueryEngine+Cards.swift
      - path: Sources/Models/QueryEngine+Compute.swift
      - path: Sources/Models/QueryEngine+Markets.swift
      - path: Sources/Models/QueryEngine+Sports.swift
      - path: Sources/Models/QueryResult.swift
      - path: Sources/Models/SearchHistory.swift
      - path: Sources/Models/Turns.swift
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Nimble.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nulljosh.nimble.ios
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Nimble
        CODE_SIGN_STYLE: Automatic
  NimbleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      # ESPN scoreboard fixtures, trimmed (the same files test/fixtures/ uses for the web)
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Nimble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.tests
        GENERATE_INFOPLIST_FILE: YES
