name: Nimble
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    # Must live under `base:` — as a sibling of it xcodegen ignores it entirely,
    # and signing fails with "requires a development team".
    DEVELOPMENT_TEAM: QMM486NPYC
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nimble:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "iOS/**"
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble
        GENERATE_INFOPLIST_FILE: YES
        # Required for notarization, which is what stops downloads landing in
        # "unidentified developer" jail. scripts/release-macos.sh does the rest.
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  Nimble-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Models
      - path: Sources/Views
        excludes:
          - "SearchView.swift"
          - "VisualEffectView.swift"
          - "ContextMenuView.swift"
          - "SettingsView.swift"
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Nimble
        # Mirrors the macOS target. Its absence is the real cause of ITMS-90242
        # on upload, which reads like a signing failure but is not.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Must be the _Generation flag, not `INFOPLIST_KEY_UILaunchScreen: {}`.
        # An empty dict is silently dropped, the built Info.plist ends up with no
        # UILaunchScreen key at all, and iOS then runs the app letterboxed in
        # 320x480 compatibility mode instead of at native resolution.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        # NB: Resources/Nimble.entitlements is a macOS-flavoured file that is
        # bundled as a *resource* and never wired to signing — not this one.
        CODE_SIGN_ENTITLEMENTS: Nimble-iOS.entitlements
  NimbleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Nimble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nimble.tests
        GENERATE_INFOPLIST_FILE: YES
